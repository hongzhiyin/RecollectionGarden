name: Desktop Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'desktop/**', 'scripts/**', 'tests/**', 'package*.json', 'vite.config.ts', 'tsconfig.json', 'docs/*preview.md', 'docs/desktop-release-notes.md', '.github/workflows/desktop-release.yml']
permissions:
  contents: read
jobs:
  windows:
    timeout-minutes: 20
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Checkout paired DreamEdge source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hongzhiyin/DreamEdge
          ref: 99bcbec4ba4a66e41b73876f93f8ce2b844ff1d0
          path: dreamedge
          persist-credentials: false
      - name: Build and test DreamEdge Windows launch
        working-directory: dreamedge
        run: |
          npm ci
          npm run check
          npm run build
          node --test dist/test/launch.test.js dist/test/launch-paths.test.js dist/test/launch-mcp.test.js dist/test/web-host.test.js dist/test/package-policy.test.js
      - name: Install matching ARM64 search binary
        if: matrix.arch == 'arm64'
        working-directory: dreamedge
        run: npm install --no-save --package-lock=false --force @vscode/ripgrep-win32-arm64@1.18.0
      - name: Package paired DreamEdge
        working-directory: dreamedge
        run: node dist/scripts/package-application.js --arch ${{ matrix.arch }}
      - name: Check Windows AI launcher boundaries
        if: matrix.arch == 'x64'
        run: dotnet run --project desktop/windows/tests/WindowsLaunchChecks.csproj
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --test tests/service/bridge.test.mjs tests/service/desktop.test.mjs tests/service/desktop-lifecycle.test.mjs
      - run: node scripts/package-windows.mjs ${{ matrix.arch }}
      - name: Install WebView2 runtime for native verification
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
          Start-Process $setup -ArgumentList '/silent /install' -Wait
      - name: Verify native reader and packaged CLI/MCP
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          ./scripts/verify-windows.ps1 "releases/RecollectionGarden-$version-windows-x64"
      - name: Verify packaged reader and DreamEdge end to end
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          ./scripts/verify-windows-pair.ps1 "releases/RecollectionGarden-$version-windows-x64" "dreamedge/release/DreamEdge-win32-x64"
      - name: Archive paired DreamEdge
        shell: pwsh
        run: |
          $version = node -p "require('./dreamedge/package.json').version"
          $zip = "releases/DreamEdge-$version-windows-${{ matrix.arch }}.zip"
          Compress-Archive -LiteralPath "dreamedge/release/DreamEdge-win32-${{ matrix.arch }}" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $([System.IO.Path]::GetFileName($zip))" | Set-Content "$zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.arch == 'x64'
        with:
          retention-days: 7
          name: windows-native-verification
          path: |
            test-results/windows-native/
            test-results/windows-pair/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          retention-days: 7
          name: desktop-package-windows-${{ matrix.arch }}
          path: |
            releases/*.zip
            releases/*.zip.sha256
          if-no-files-found: error
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          architecture: arm64
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:mac -- --release
      - run: node --test tests/service/bridge.test.mjs tests/service/desktop.test.mjs tests/service/desktop-lifecycle.test.mjs
      - name: Verify DMG, relocated bundle and packaged CLI/MCP
        run: node scripts/verify-macos.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-package-verification
          path: test-results/macos-package/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-package-macos-arm64
          path: |
            releases/*.dmg
            releases/*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-package-*
          merge-multiple: true
          path: packages
      - name: Publish desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}-preview.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/* --clobber
          else
            gh release create "$tag" packages/* --target "$GITHUB_SHA" --prerelease --title "流光忆庭 ${version} · Mac / Windows 体验版" --notes-file docs/desktop-release-notes.md
          fi
